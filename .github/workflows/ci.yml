name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install ShellCheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    - name: Validate YAML
      run: python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['.github/workflows/ci.yml']]; print('YAML valid')"
    - name: Run ShellCheck
      run: |
        # Check if files exist before running shellcheck
        find bin -type f -executable -exec shellcheck {} \; 2>/dev/null || true
        find lib -name "*.bash" -exec shellcheck {} \; 2>/dev/null || true
        # Run with error severity for critical issues
        find bin -type f -executable -exec shellcheck --severity=error {} \; 2>/dev/null || true
        find lib -name "*.bash" -exec shellcheck --severity=error {} \; 2>/dev/null || true

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Bats
      run: |
        sudo apt-get update
        sudo apt-get install -y bats
    - name: Setup Bats Libraries
      run: |
        git clone https://github.com/bats-core/bats-support.git test/bats-support
        git clone https://github.com/bats-core/bats-assert.git test/bats-assert
    - name: Run Bats Tests
      run: |
        export plugin_dir="$(pwd)"
        bats test/utils.bats
      continue-on-error: true
    - name: Run Bash Tests  
      run: |
        export plugin_dir="$(pwd)"
        bash test/test.sh
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ## Test Results
          - **Status**: ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
          - **Details**: See [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full logs.
          Ensure all checks pass before merging.

  consistency:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install shfmt
      run: |
        curl -fsSL https://github.com/mvdan/sh/releases/latest/download/shfmt_v3.12.0_linux_amd64 -o shfmt
        sudo install shfmt /usr/local/bin/
        rm shfmt
    - name: Check shell formatting
      run: |
        # Check if files need formatting
        find bin -type f -executable -exec shfmt -d {} \; 2>/dev/null || true
        find lib -name "*.bash" -exec shfmt -d {} \; 2>/dev/null || true
        find test -name "*.sh" -exec shfmt -d {} \; 2>/dev/null || true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js for npm audit
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run npm audit (if package.json exists)
      run: |
        if [ -f "package.json" ]; then
          npm audit --audit-level=moderate || echo "npm audit completed with issues"
        else
          echo "No package.json found, skipping npm audit"
        fi
      continue-on-error: true
    - name: Security Scan with Trivy
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        trivy-args: '--ignore-unfixed --security-checks vuln'
      continue-on-error: true
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'